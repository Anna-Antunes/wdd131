<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página do País que quero visitar - Japão, uma das culturas mais ricas do mundo.">
    <meta name="author" content="Anna Antunes">
    <title>Página do País</title>
    <link rel="stylesheet" href="estilos/local-ampla.css">
    <script src="scripts/local.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
<header>
<div class="titulo">
<h1><span id="nome-do-pais">Japão</span></h1>
</div>
<hr>
</header>
<main>
    <div class="templo">
    <picture>
    <source srcset="imagens/templojapao.webp" media="(min-width: 1000px)"> 
     <source srcset="imagens/japaopequena.webp" media="(min-width: 500px)"> 
     <img src="imagens/japaomedia.webp" alt="Templo do Japão" width="500" height="250">
    </picture>
    </div>

    <section class="data">
    <div class="informacoes">
    <h2>Data</h2>

        <p><strong>Área:</strong> 377,975 km²</p>
        <p><strong>População:</strong> 124 631 000</p>
        <p><strong>Linguagem:</strong> Japanese</p>
        <p><strong>Moeda:</strong> Iene (JPY)</p>
        <p><strong>Fuso Horário</strong> UTC+9</p>
        <p><strong>Código de Discagem:</strong> +81</p>
        <p><strong>Internet TLD:</strong> .jp</p>
    </div>
    </section>

   <section class="clima">
      
      <div class="tempo">
        <h2>Clima</h2>
        <img class="sol" src="imagens/ensolarado.svg" alt="ícone de sol">
        <p><strong>Temperatura:</strong><span id="temperatura"></span></p>
        <p><strong>Condições:</strong><span id="condicoes"></span></p>
        <p><strong>Vento:</strong><span id="vento"></span> </p>
        <p><strong>Sensação Térmica:</strong><span id="sensacaoTermica"></span></p>
      </div>
    </section>

</main>
    
<footer>
<p>&copy; <span id="anoatual"></span> 🌅 Anna Antunes🌅 Salvador</p>
<p>Última modificação: <span id="ultimaModificacao"> </span></p>
</footer>
</body>
</html>
